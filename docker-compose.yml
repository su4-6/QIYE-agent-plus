services:
  ticket-agent:
    build: .
    container_name: ticket-agent-system
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: /app/data/tickets.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - embedding-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  embedding-cache:
