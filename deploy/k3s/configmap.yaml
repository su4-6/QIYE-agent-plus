apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-desk-config
  namespace: atlas-desk
data:
  APP_NAME: "Atlas Desk 企业工单智能处理系统"
  APP_ENV: "production"
  DATABASE_URL: "/app/data/tickets.db"
  LLM_PROVIDER: "mimo"
  MIMO_BASE_URL: "https://api.xiaomimimo.com/v1"
  MIMO_MODEL: "mimo-v2.5-pro"
  EMBEDDING_PROVIDER: "gemini"
  EMBEDDING_MODEL: "gemini-embedding-2"
  MAX_PUBLIC_HOURLY: "10"
  MAX_LLM_DAILY: "100"
  HIGH_RISK_KEYWORDS: "生产,支付,订单,财务,法务,高管,管理员,批量,数据删除,权限提升,海外访问"
