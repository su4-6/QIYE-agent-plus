apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-desk
  namespace: atlas-desk
  labels:
    app.kubernetes.io/name: atlas-desk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-desk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-desk
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: atlas-desk
          imagePullPolicy: Always
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips=*
          envFrom:
            - configMapRef:
                name: atlas-desk-config
            - secretRef:
                name: atlas-desk-secrets
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atlas-desk-data
