apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: atlas-desk
  name: atlas-desk
---
apiVersion: v1
data:
  APP_ENV: production
  APP_NAME: Atlas Desk · 智能工单处理 Agent（个人项目）
  DATABASE_URL: /app/data/tickets.db
  EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
  EMBEDDING_PROVIDER: local
  FASTEMBED_CACHE_PATH: /opt/atlas-models
  HF_HUB_OFFLINE: '1'
  HIGH_RISK_KEYWORDS: 生产,支付,订单,财务,法务,高管,管理员,批量,数据删除,权限提升,海外访问
  LOW_RISK_ASSISTANCE: 'true'
  ADMIN_USERNAME: admin
  LLM_PROVIDER: mimo
  MAX_LLM_DAILY: '100'
  MAX_PUBLIC_HOURLY: '10'
  MIMO_BASE_URL: https://api.xiaomimimo.com/v1
  MIMO_MODEL: mimo-v2.5-pro
kind: ConfigMap
metadata:
  name: atlas-desk-config
  namespace: atlas-desk
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-desk
  namespace: atlas-desk
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/name: atlas-desk
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-desk-data
  namespace: atlas-desk
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: atlas-desk
  name: atlas-desk
  namespace: atlas-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-desk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-desk
    spec:
      containers:
      - args:
        - python -c 'from app.database import init_database; from app.knowledge import
          seed_demo; init_database(); seed_demo()' && python scripts/import-demo.py
          && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
          --forwarded-allow-ips='*'
        command:
        - sh
        - -c
        envFrom:
        - configMapRef:
            name: atlas-desk-config
        - secretRef:
            name: atlas-desk-secrets
        image: docker.io/suqihang/atlas-desk@sha256:59d54a2150b4a2ad40b32a182eb569b0eb68eddb55f04f9ee9ca2b0caf9cfc2b
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 3
        name: app
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: '1'
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 48
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /app/data
          name: data
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: atlas-desk-data
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-desk
  namespace: minipay
spec:
  hostnames:
  - ticket.su46proj.site
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: minipay-gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: atlas-desk
      namespace: atlas-desk
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-minipay-gateway
  namespace: atlas-desk
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: minipay
  to:
  - group: ''
    kind: Service
    name: atlas-desk
