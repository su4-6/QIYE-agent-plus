apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-desk
  namespace: minipay
spec:
  hostnames:
  - ticket.su46proj.site
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: minipay-gateway
    sectionName: https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: atlas-desk
      namespace: atlas-desk
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-minipay-gateway
  namespace: atlas-desk
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: minipay
  to:
  - group: ''
    kind: Service
    name: atlas-desk
