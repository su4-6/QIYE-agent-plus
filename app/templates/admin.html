<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23146c5e'/%3E%3Cpath d='M8 23 16 7l8 16h-4l-1.5-3h-5L12 23z' fill='white'/%3E%3C/svg%3E"><title>Atlas Desk · 管理台</title>
<style>
:root{--ink:#17212b;--muted:#68747f;--paper:#f1eee8;--card:#fffdfa;--line:#d9d4ca;--brand:#146c5e;--danger:#a63c3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{background:#142b2a;color:#fff;padding:22px max(22px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between}h1{font:700 28px Georgia,"Microsoft YaHei";margin:0}main{max-width:1180px;margin:28px auto;padding:0 22px}.panel,.ticket{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.login{max-width:440px;margin:70px auto}h2{margin:0 0 4px}.muted{color:var(--muted)}input,textarea{width:100%;padding:10px 11px;border:1px solid #c9c3b8;border-radius:8px;font:inherit;margin:7px 0 12px}button{border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;padding:9px 14px;cursor:pointer}button.secondary{background:#e9e5dd;color:var(--ink)}button.danger{background:var(--danger)}.bar,.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:15px;background:#eaf3f0;border-radius:10px}.stat b{display:block;font-size:24px}.badge{font-size:12px;border-radius:99px;padding:4px 9px;background:#e7eee9}.pending{background:#fae4dc;color:#8b321e}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);margin:8px 0}.answer{white-space:pre-wrap;background:#f5f2ec;border-radius:8px;padding:12px;margin:10px 0}.actions{display:flex;gap:8px}.audit{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.hidden{display:none}.error{color:var(--danger)}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Atlas Desk / 管理台</h1><a href="/" style="color:#c7d8d4">返回公开演示</a></header>
<main><section id="login" class="panel login"><h2>管理员登录</h2><p class="muted">输入启动本地服务时设置的管理员密码，至少 8 位。</p><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="管理员密码（至少 8 位）"><button onclick="login()">登录</button><p id="loginError" class="error"></p></section>
<div id="workspace" class="hidden"><section class="panel"><div class="bar"><div><h2>运行概览</h2><div class="muted">演示租户 · 审批与审计工作台</div></div><div class="actions"><button class="secondary" onclick="loadTickets()">刷新</button><button class="secondary" onclick="logout()">退出</button></div></div><div class="stats"><div class="stat"><b id="total">0</b>工单总数</div><div class="stat"><b id="pending">0</b>待人工处理</div><div class="stat"><b id="highRisk">0</b>高风险工单</div><div class="stat"><b id="modelStatus">读取中</b>生成模型</div></div></section>
<section class="panel"><h2>导入知识文档</h2><p class="muted">支持 TXT、Markdown 和可提取文本的 PDF；新版本会停用同名旧版本。</p><input id="knowledge" type="file" accept=".txt,.md,.pdf"><button onclick="upload()">上传并建立索引</button><span id="uploadResult" class="muted"></span></section><div id="tickets"></div></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let csrf=sessionStorage.getItem('atlas-csrf')||'';
function apiError(d){if(typeof d?.detail==='string')return d.detail;if(Array.isArray(d?.detail))return d.detail.map(x=>x?.loc?.includes('password')?'管理员密码至少需要 8 位':(x?.msg||'输入内容不符合要求')).join('；');return '操作失败，请稍后重试'}
async function request(url,opt={}){opt.headers={...(opt.headers||{}),...(csrf?{'X-CSRF-Token':csrf}:{})};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(apiError(d));return d}
async function login(){const password=document.querySelector('#password').value;const error=document.querySelector('#loginError');if(password.length<8){error.textContent='管理员密码至少需要 8 位；请使用启动服务时设置的密码。';return}try{error.textContent='';const d=await request('/api/v1/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});csrf=d.csrf_token;sessionStorage.setItem('atlas-csrf',csrf);document.querySelector('#login').classList.add('hidden');document.querySelector('#workspace').classList.remove('hidden');await loadTickets()}catch(e){error.textContent=e.message}}
async function loadTickets(){try{const [d,h]=await Promise.all([request('/api/v1/admin/tickets'),request('/health')]);total.textContent=d.total;pending.textContent=d.items.filter(x=>x.status==='待人工处理').length;highRisk.textContent=d.items.filter(x=>x.risk_level==='高风险').length;modelStatus.textContent=h.llm_enabled?h.llm_model:'离线';tickets.innerHTML=d.items.map(card).join('')||'<section class="panel muted">暂无工单</section>'}catch(e){sessionStorage.removeItem('atlas-csrf');document.querySelector('#login').classList.remove('hidden');document.querySelector('#workspace').classList.add('hidden')}}
function card(t){const pending=t.status==='待人工处理';return `<section class="ticket"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.ticket_id)}</div></div><span class="badge ${pending?'pending':''}">${esc(t.status)}</span></div><div class="meta"><span>${esc(t.category)}</span><span>${esc(t.priority)}优先级</span><span>${esc(t.risk_level)}</span><span>证据 ${Math.round(t.confidence*100)}%</span></div><div class="answer">${esc(t.answer)}</div><div class="actions">${pending?`<button onclick="approve('${esc(t.ticket_id)}',true)">批准人工执行</button><button class="danger" onclick="approve('${esc(t.ticket_id)}',false)">拒绝</button>`:''}<button class="secondary" onclick="audit('${esc(t.ticket_id)}')">查看审计</button></div><div id="audit-${esc(t.ticket_id)}" class="audit hidden"></div></section>`}
async function approve(id,approved){const comment=prompt('请输入审批意见')||'';try{await request(`/api/v1/admin/tickets/${id}/approval`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({是否通过:approved,审批人:'演示管理员',审批意见:comment})});await loadTickets()}catch(e){alert(e.message)}}
async function audit(id){try{const d=await request(`/api/v1/admin/tickets/${id}/audit-logs`);const el=document.getElementById('audit-'+id);el.classList.remove('hidden');el.innerHTML=d.map(x=>`<div><b>${esc(x.action)}</b> · ${esc(x.operator)} · ${esc(x.created_at)}</div>`).join('')}catch(e){alert(e.message)}}
async function upload(){const f=knowledge.files[0];if(!f)return;const body=new FormData();body.append('file',f);try{const d=await request('/api/v1/admin/knowledge',{method:'POST',body});uploadResult.textContent=` 已导入 v${d.version}，${d.chunks} 个段落`}catch(e){uploadResult.textContent=' '+e.message}}
async function logout(){try{await request('/api/v1/admin/logout',{method:'POST'})}finally{sessionStorage.removeItem('atlas-csrf');location.reload()}}
if(csrf){document.querySelector('#login').classList.add('hidden');document.querySelector('#workspace').classList.remove('hidden');loadTickets()}
</script></body></html>
